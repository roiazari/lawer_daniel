<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>דניאל לוי - משרד עורכי דין</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
      // Redirect to the correct path for single-page applications on GitHub Pages
      const path = window.location.pathname;
      const repoName = '/lawyer-website/';
      if (path.startsWith(repoName)) {
        const newPath = path.substring(repoName.length);
        window.history.replaceState(null, '', repoName + '#' + '/' + newPath);
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script async src="https://www.tiktok.com/embed.js"></script>
  </body>
